; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = hub_ttgo_wattcycle
description = BLE/SPP → Wi‑Fi / ESP-NOW energy gateway monorepo
src_dir = src

[env]
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

[ttgo_display]
build_flags = 
	-DUSER_SETUP_LOADED=1
	-DST7789_DRIVER=1
	-DTFT_WIDTH=135
	-DTFT_HEIGHT=240
	-DTFT_MOSI=19
	-DTFT_SCLK=18
	-DTFT_CS=5
	-DTFT_DC=16
	-DTFT_RST=23
	-DTFT_BL=4
	-DLOAD_GLCD=1
	-DLOAD_FONT2=1
	-DLOAD_FONT4=1
	-DSPI_FREQUENCY=40000000
	-DTOUCH_CS=-1

[env:hub_ttgo_wattcycle]
platform = espressif32
board = esp32dev
framework = arduino
upload_port = COM19
monitor_port = COM19
board_build.partitions = min_spiffs.csv
board_build.filesystem = littlefs
extra_scripts = pre:scripts/pio_bundle_web.py
lib_deps = 
	h2zero/NimBLE-Arduino@^1.4.3
	bodmer/TFT_eSPI@^2.5.43
build_flags = 
	${ttgo_display.build_flags}
	-DCORE_DEBUG_LEVEL=1
	-DWEB_SERVER_PORT=6789
	-DBMS_POLL_INTERVAL_MS=2000
	-DARDUINO_USB_CDC_ON_BOOT=0
	-I src/hub_ttgo_wattcycle
	-I src/hub_common
	-I src/common
	'-DWIFI_SSID="${sysenv.WIFI_SSID}"'
	'-DWIFI_PASS="${sysenv.WIFI_PASS}"'
	'-DBMS_BLE_ADDRESS="${sysenv.BMS_BLE_ADDRESS}"'
	'-DESPNOW_BRIDGE_MAC="${sysenv.ESPNOW_BRIDGE_MAC}"'
	'-DESPNOW_PMK="${sysenv.ESPNOW_PMK}"'
	'-DOTA_HOSTNAME="wattcycle-gateway"'
build_src_filter = 
	+<common/>
	+<hub_common/>
	+<hub_ttgo_wattcycle/>
	-<bridge_xt369p/>
	-<bridge_ttgo_wattcycle/>
	-<bridge_ecoflow_delta3/>
	-<hub_m5_wattcycle/>

[env:ttgo-tdisplay]
extends = env:hub_ttgo_wattcycle

[env:hub_m5_wattcycle]
platform = espressif32
board = m5stack-core-esp32
framework = arduino
upload_port = COM23
monitor_port = COM23
board_build.partitions = min_spiffs.csv
board_build.filesystem = littlefs
board_upload.flash_size = 4MB
extra_scripts = pre:scripts/pio_bundle_web.py
lib_deps = 
	m5stack/M5Unified@^0.2.2
lib_ldf_mode = chain+
build_flags = 
	-DCORE_DEBUG_LEVEL=1
	-DWEB_SERVER_PORT=6789
	-DARDUINO_USB_CDC_ON_BOOT=0
	-I src/hub_m5_wattcycle
	-I src/hub_common
	-I src/common
	'-DWIFI_SSID="${sysenv.WIFI_SSID}"'
	'-DWIFI_PASS="${sysenv.WIFI_PASS}"'
	'-DESPNOW_BMS_BRIDGE_MAC="${sysenv.ESPNOW_BMS_BRIDGE_MAC}"'
	'-DESPNOW_BRIDGE_MAC="${sysenv.ESPNOW_BRIDGE_MAC}"'
	'-DESPNOW_ECOFLOW_BRIDGE_MAC="${sysenv.ESPNOW_ECOFLOW_BRIDGE_MAC}"'
	'-DESPNOW_PMK="${sysenv.ESPNOW_PMK}"'
	'-DOTA_HOSTNAME="wattcycle-gateway"'
build_src_filter = 
	+<common/>
	+<hub_common/>
	+<hub_m5_wattcycle/>
	-<bridge_xt369p/>
	-<bridge_ttgo_wattcycle/>
	-<bridge_ecoflow_delta3/>
	-<hub_ttgo_wattcycle/>

[env:bridge_ttgo_wattcycle]
platform = espressif32
board = esp32dev
framework = arduino
upload_port = COM19
monitor_port = COM19
board_build.partitions = min_spiffs.csv
lib_deps = 
	h2zero/NimBLE-Arduino@^1.4.3
	bodmer/TFT_eSPI@^2.5.43
build_flags = 
	${ttgo_display.build_flags}
	-DCORE_DEBUG_LEVEL=1
	-DBMS_POLL_INTERVAL_MS=2000
	-DARDUINO_USB_CDC_ON_BOOT=0
	-I src/bridge_ttgo_wattcycle
	-I src/common
	'-DWIFI_SSID="${sysenv.WIFI_SSID}"'
	'-DBMS_BLE_ADDRESS="${sysenv.BMS_BLE_ADDRESS}"'
	'-DESPNOW_PEER_MAC="${sysenv.ESPNOW_PEER_MAC}"'
	'-DESPNOW_PMK="${sysenv.ESPNOW_PMK}"'
	'-DESPNOW_CHANNEL="${sysenv.ESPNOW_CHANNEL}"'
build_src_filter = 
	+<common/>
	+<bridge_ttgo_wattcycle/>
	-<hub_common/>
	-<hub_ttgo_wattcycle/>
	-<bridge_xt369p/>
	-<bridge_ecoflow_delta3/>
	-<hub_m5_wattcycle/>

[env:bridge_xt369p]
platform = espressif32
board = esp32dev
framework = arduino
upload_port = COM22
monitor_port = COM22
board_build.partitions = min_spiffs.csv
lib_deps = 
	bodmer/TFT_eSPI@^2.5.43
build_flags = 
	${ttgo_display.build_flags}
	-DCORE_DEBUG_LEVEL=1
	-DSPP_RECONNECT_INTERVAL_MS=5000
	-DARDUINO_USB_CDC_ON_BOOT=0
	-I src/bridge_xt369p
	-I src/common
	'-DWIFI_SSID="${sysenv.WIFI_SSID}"'
	'-DXT369P_BT_ADDRESS="${sysenv.XT369P_BT_ADDRESS}"'
	'-DESPNOW_PEER_MAC="${sysenv.ESPNOW_PEER_MAC}"'
	'-DESPNOW_PMK="${sysenv.ESPNOW_PMK}"'
	'-DESPNOW_CHANNEL="${sysenv.ESPNOW_CHANNEL}"'
build_src_filter = 
	+<common/>
	+<bridge_xt369p/>
	-<hub_common/>
	-<hub_ttgo_wattcycle/>
	-<bridge_ttgo_wattcycle/>
	-<bridge_ecoflow_delta3/>
	-<hub_m5_wattcycle/>
	-<common/Bms/>

[env:bridge_ecoflow_delta3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
upload_port = COM8
monitor_port = COM8
board_build.partitions = min_spiffs.csv
extra_scripts =
	pre:scripts/pio_embed_ecoflow_login_key.py
lib_deps =
	h2zero/NimBLE-Arduino@^2.3.0
build_flags =
	-DCORE_DEBUG_LEVEL=1
	-DARDUINO_USB_MODE=1
	; Keep CDC off — Serial still lands on native USB (COM8) on this S3 DevKitC.
	-DARDUINO_USB_CDC_ON_BOOT=0
	; NimBLE mbuf pool — default 12 OOMs (rc=7) during GATT + conn-update race.
	-DCONFIG_BT_NIMBLE_MSYS1_BLOCK_COUNT=64
	-DCONFIG_BT_NIMBLE_ACL_BUF_COUNT=32
	-DCONFIG_BT_NIMBLE_ATT_PREFERRED_MTU=247
	-DCONFIG_BT_NIMBLE_HCI_EVT_BUF_COUNT=30
	-I src/bridge_ecoflow_delta3
	-I src/common
	'-DWIFI_SSID="${sysenv.WIFI_SSID}"'
	'-DECOFLOW_BLE_ADDRESS="${sysenv.ECOFLOW_BLE_ADDRESS}"'
	'-DECOFLOW_SERIAL="${sysenv.ECOFLOW_SERIAL}"'
	'-DECOFLOW_USER_ID="${sysenv.ECOFLOW_USER_ID}"'
	'-DESPNOW_PEER_MAC="${sysenv.ESPNOW_PEER_MAC}"'
	'-DESPNOW_PMK="${sysenv.ESPNOW_PMK}"'
	'-DESPNOW_CHANNEL="${sysenv.ESPNOW_CHANNEL}"'
build_src_filter =
	+<bridge_ecoflow_delta3/>
	-<common/>
	-<hub_common/>
	-<hub_ttgo_wattcycle/>
	-<bridge_ttgo_wattcycle/>
	-<bridge_xt369p/>
	-<hub_m5_wattcycle/>

[env:native]
platform = native
test_framework = unity
build_flags = 
	-DUNIT_TEST
	-std=c++17
	-I src/hub_common
	-I src/common
	-I src/hub_ttgo_wattcycle
	-I src/bridge_xt369p
	-I src/bridge_ecoflow_delta3
build_src_filter = 
	+<common/Util/RandomBytes.cpp>
	+<hub_common/Telemetry/BinaryTelemetryCodec.cpp>
	+<hub_common/Telemetry/InMemoryTelemetryStore.cpp>
	+<hub_common/Auth/Sha256.cpp>
	+<hub_common/Auth/PasswordHasher.cpp>
	+<hub_common/Auth/CredentialPolicy.cpp>
	+<hub_common/Auth/SessionStore.cpp>
	+<hub_common/HttpApi/JsonField.cpp>
	+<hub_ttgo_wattcycle/Bms/Protocol/*>
	+<hub_ttgo_wattcycle/Bms/Ble/BlePacketAssembler.cpp>
	+<bridge_xt369p/Meter/Protocol/AtorchFrameParser.cpp>
	+<bridge_ecoflow_delta3/EcoFlow/Protocol/EcoFlowCrc.cpp>
	+<bridge_ecoflow_delta3/EcoFlow/Protocol/EcoFlowPacketCodec.cpp>
	+<bridge_ecoflow_delta3/EcoFlow/Protocol/EcoFlowProtobuf.cpp>
	+<bridge_ecoflow_delta3/EcoFlow/Protocol/EcoFlowDisplayPropertyDecoder.cpp>
	-<hub_common/Auth/AuthService.cpp>
	-<hub_common/Auth/NvsCredentialStore.cpp>
	-<hub_common/HttpApi/EspWebGateway.cpp>
	-<hub_common/Ota/>
	-<hub_common/Esp/>
	-<hub_ttgo_wattcycle/main.cpp>
	-<hub_ttgo_wattcycle/CompositionRoot/*>
	-<hub_ttgo_wattcycle/Wifi/*>
	-<hub_ttgo_wattcycle/Bms/Ble/WattcycleBleClient.cpp>
	-<hub_ttgo_wattcycle/Display/*>
	-<hub_ttgo_wattcycle/EspNow/*>
	-<hub_ttgo_wattcycle/Config/*>
	-<hub_ttgo_wattcycle/Telemetry/TelemetryPoller.cpp>
	-<bridge_xt369p/main.cpp>
	-<bridge_xt369p/CompositionRoot/*>
	-<bridge_xt369p/Display/*>
	-<bridge_xt369p/Esp/*>
	-<bridge_xt369p/EspNow/*>
	-<bridge_xt369p/Meter/Spp/*>
	-<bridge_xt369p/Meter/Protocol/AtorchCommands.cpp>
	-<bridge_xt369p/Telemetry/*>
	-<bridge_xt369p/Config/*>
test_build_src = yes
