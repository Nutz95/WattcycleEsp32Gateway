; Wattcycle ESP32 Gateway — PlatformIO configuration
; Hardware: LILYGO TTGO T-Display (ESP32-D0WDQ6, 4MB flash, ST7789V 1.14")

[platformio]
default_envs = ttgo-tdisplay
description = BLE → WiFi gateway for Wattcycle / XDZN BMS telemetry

[env]
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; ---------------------------------------------------------------------------
; Firmware target — classic ESP32 (NOT S3)
; ---------------------------------------------------------------------------
[env:ttgo-tdisplay]
platform = espressif32
board = esp32dev
framework = arduino
upload_port = COM19
monitor_port = COM19
board_build.partitions = min_spiffs.csv
board_build.filesystem = littlefs
extra_scripts = pre:scripts/pio_bundle_web.py
lib_deps =
	h2zero/NimBLE-Arduino@^1.4.3
	bodmer/TFT_eSPI@^2.5.43
build_flags =
	-DCORE_DEBUG_LEVEL=1
	-DWEB_SERVER_PORT=6789
	-DBMS_POLL_INTERVAL_MS=2000
	-DARDUINO_USB_CDC_ON_BOOT=0

	; TFT_eSPI — TTGO T-Display ST7789V pinout (see Resources/Esp32-TTGO_Pinout.png)
	-DUSER_SETUP_LOADED=1
	-DST7789_DRIVER=1
	-DTFT_WIDTH=135
	-DTFT_HEIGHT=240
	-DTFT_MOSI=19
	-DTFT_SCLK=18
	-DTFT_CS=5
	-DTFT_DC=16
	-DTFT_RST=23
	-DTFT_BL=4
	-DLOAD_GLCD=1
	-DLOAD_FONT2=1
	-DLOAD_FONT4=1
	-DSPI_FREQUENCY=40000000
	-DTOUCH_CS=-1

	; Secrets injected from host environment — never commit credentials
	'-DWIFI_SSID="${sysenv.WIFI_SSID}"'
	'-DWIFI_PASS="${sysenv.WIFI_PASS}"'
	'-DBMS_BLE_ADDRESS="${sysenv.BMS_BLE_ADDRESS}"'
	'-DESPNOW_BRIDGE_MAC="${sysenv.ESPNOW_BRIDGE_MAC}"'
	'-DESPNOW_PMK="${sysenv.ESPNOW_PMK}"'
	'-DOTA_HOSTNAME="wattcycle-gateway"'
build_src_filter =
	+<*>
	-<native/>

; ---------------------------------------------------------------------------
; Host-side unit tests (no hardware required)
; ---------------------------------------------------------------------------
[env:native]
platform = native
test_framework = unity
build_flags =
	-DUNIT_TEST
	-std=c++17
	-I src
build_src_filter =
	+<Bms/Protocol/*>
	+<Bms/Ble/BlePacketAssembler.cpp>
	+<Telemetry/BinaryTelemetryCodec.cpp>
	+<Telemetry/InMemoryTelemetryStore.cpp>
	+<Auth/Sha256.cpp>
	+<Auth/PasswordHasher.cpp>
	+<Auth/CredentialPolicy.cpp>
	+<Auth/SessionStore.cpp>
	+<Util/RandomBytes.cpp>
	+<Web/JsonField.cpp>
	-<main.cpp>
	-<CompositionRoot/*>
	-<Wifi/*>
	-<Ota/*>
	-<Bms/Ble/WattcycleBleClient.cpp>
	-<Display/*>
	-<Esp/*>
	-<Auth/AuthService.cpp>
	-<Auth/NvsCredentialStore.cpp>
	-<Web/EspWebGateway.cpp>
	-<Config/*>
	-<Telemetry/TelemetryPoller.cpp>
	-<Telemetry/TelemetryJsonSerializer.cpp>
test_build_src = yes


