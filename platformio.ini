; Wattcycle ESP32 Gateway — monorepo (hub TTGO Wattcycle + XT369P bridge)
; Hardware: LILYGO TTGO T-Display (ESP32-D0WDQ6, ST7789V 1.14")

[platformio]
default_envs = hub_ttgo_wattcycle
description = BLE/SPP → Wi‑Fi / ESP-NOW energy gateway monorepo
src_dir = src

[env]
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Shared TTGO display flags (both firmwares)
[ttgo_display]
build_flags =
	-DUSER_SETUP_LOADED=1
	-DST7789_DRIVER=1
	-DTFT_WIDTH=135
	-DTFT_HEIGHT=240
	-DTFT_MOSI=19
	-DTFT_SCLK=18
	-DTFT_CS=5
	-DTFT_DC=16
	-DTFT_RST=23
	-DTFT_BL=4
	-DLOAD_GLCD=1
	-DLOAD_FONT2=1
	-DLOAD_FONT4=1
	-DSPI_FREQUENCY=40000000
	-DTOUCH_CS=-1

; ---------------------------------------------------------------------------
; Hub: Wattcycle BMS BLE + Wi‑Fi web + ESP-NOW RX (COM19)
; ---------------------------------------------------------------------------
[env:hub_ttgo_wattcycle]
platform = espressif32
board = esp32dev
framework = arduino
upload_port = COM19
monitor_port = COM19
board_build.partitions = min_spiffs.csv
board_build.filesystem = littlefs
extra_scripts = pre:scripts/pio_bundle_web.py
lib_deps =
	h2zero/NimBLE-Arduino@^1.4.3
	bodmer/TFT_eSPI@^2.5.43
build_flags =
	${ttgo_display.build_flags}
	-DCORE_DEBUG_LEVEL=1
	-DWEB_SERVER_PORT=6789
	-DBMS_POLL_INTERVAL_MS=2000
	-DARDUINO_USB_CDC_ON_BOOT=0
	-I src/common
	-I src/hub_ttgo_wattcycle
	'-DWIFI_SSID="${sysenv.WIFI_SSID}"'
	'-DWIFI_PASS="${sysenv.WIFI_PASS}"'
	'-DBMS_BLE_ADDRESS="${sysenv.BMS_BLE_ADDRESS}"'
	'-DESPNOW_BRIDGE_MAC="${sysenv.ESPNOW_BRIDGE_MAC}"'
	'-DESPNOW_PMK="${sysenv.ESPNOW_PMK}"'
	'-DOTA_HOSTNAME="wattcycle-gateway"'
build_src_filter =
	+<common/>
	+<hub_ttgo_wattcycle/>
	-<bridge_xt369p/>
	-<bridge_ttgo_wattcycle/>
	-<hub_m5_wattcycle/>

; Backward-compatible alias
[env:ttgo-tdisplay]
extends = env:hub_ttgo_wattcycle

; ---------------------------------------------------------------------------
; Hub: M5Stack Basic — Wi-Fi web + multi-peer ESP-NOW RX (COM23) — Phase 2
; ---------------------------------------------------------------------------
[env:hub_m5_wattcycle]
platform = espressif32
board = m5stack-core-esp32
framework = arduino
upload_port = COM23
monitor_port = COM23
; m5stack-core-esp32 board JSON + esptool report 4MB on this unit (COM23).
; default_16MB.csv put LittleFS past 4MB → uploadfs fatal. Match TTGO hub layout.
board_build.partitions = min_spiffs.csv
board_build.filesystem = littlefs
board_upload.flash_size = 4MB
extra_scripts = pre:scripts/pio_bundle_web.py
lib_deps =
	m5stack/M5Unified@^0.2.2
build_flags =
	-DCORE_DEBUG_LEVEL=1
	-DWEB_SERVER_PORT=6789
	-DARDUINO_USB_CDC_ON_BOOT=0
	-I src/hub_m5_wattcycle
	-I src/common
	'-DWIFI_SSID="${sysenv.WIFI_SSID}"'
	'-DWIFI_PASS="${sysenv.WIFI_PASS}"'
	'-DESPNOW_BMS_BRIDGE_MAC="${sysenv.ESPNOW_BMS_BRIDGE_MAC}"'
	'-DESPNOW_BRIDGE_MAC="${sysenv.ESPNOW_BRIDGE_MAC}"'
	'-DESPNOW_PMK="${sysenv.ESPNOW_PMK}"'
	'-DOTA_HOSTNAME="wattcycle-gateway"'
build_src_filter =
	+<common/>
	+<hub_m5_wattcycle/>
	-<bridge_xt369p/>
	-<bridge_ttgo_wattcycle/>
	-<hub_ttgo_wattcycle/>

; ---------------------------------------------------------------------------
; Bridge: Wattcycle BMS BLE → ESP-NOW TX (COM19) — Phase 2
; ---------------------------------------------------------------------------
[env:bridge_ttgo_wattcycle]
platform = espressif32
board = esp32dev
framework = arduino
upload_port = COM19
monitor_port = COM19
board_build.partitions = min_spiffs.csv
lib_deps =
	h2zero/NimBLE-Arduino@^1.4.3
	bodmer/TFT_eSPI@^2.5.43
build_flags =
	${ttgo_display.build_flags}
	-DCORE_DEBUG_LEVEL=1
	-DBMS_POLL_INTERVAL_MS=2000
	-DARDUINO_USB_CDC_ON_BOOT=0
	-I src/bridge_ttgo_wattcycle
	-I src/common
	'-DWIFI_SSID="${sysenv.WIFI_SSID}"'
	'-DBMS_BLE_ADDRESS="${sysenv.BMS_BLE_ADDRESS}"'
	'-DESPNOW_PEER_MAC="${sysenv.ESPNOW_PEER_MAC}"'
	'-DESPNOW_PMK="${sysenv.ESPNOW_PMK}"'
	'-DESPNOW_CHANNEL="${sysenv.ESPNOW_CHANNEL}"'
build_src_filter =
	+<common/>
	+<bridge_ttgo_wattcycle/>
	-<hub_ttgo_wattcycle/>
	-<bridge_xt369p/>
	-<hub_m5_wattcycle/>

; ---------------------------------------------------------------------------
; Bridge: XT369P Classic SPP → ESP-NOW TX (COM22)
; ---------------------------------------------------------------------------
[env:bridge_xt369p]
platform = espressif32
board = esp32dev
framework = arduino
upload_port = COM22
monitor_port = COM22
board_build.partitions = min_spiffs.csv
lib_deps =
	bodmer/TFT_eSPI@^2.5.43
build_flags =
	${ttgo_display.build_flags}
	-DCORE_DEBUG_LEVEL=1
	-DSPP_RECONNECT_INTERVAL_MS=5000
	-DARDUINO_USB_CDC_ON_BOOT=0
	-I src/common
	-I src/bridge_xt369p
	'-DWIFI_SSID="${sysenv.WIFI_SSID}"'
	'-DXT369P_BT_ADDRESS="${sysenv.XT369P_BT_ADDRESS}"'
	'-DESPNOW_PEER_MAC="${sysenv.ESPNOW_PEER_MAC}"'
	'-DESPNOW_PMK="${sysenv.ESPNOW_PMK}"'
	'-DESPNOW_CHANNEL="${sysenv.ESPNOW_CHANNEL}"'
build_src_filter =
	+<common/>
	+<bridge_xt369p/>
	-<hub_ttgo_wattcycle/>
	-<bridge_ttgo_wattcycle/>
	-<hub_m5_wattcycle/>

; ---------------------------------------------------------------------------
; Host-side unit tests (hub parsers / auth / codec)
; ---------------------------------------------------------------------------
[env:native]
platform = native
test_framework = unity
build_flags =
	-DUNIT_TEST
	-std=c++17
	-I src/common
	-I src/hub_ttgo_wattcycle
	-I src/bridge_xt369p
build_src_filter =
	+<common/Util/RandomBytes.cpp>
	+<hub_ttgo_wattcycle/Bms/Protocol/*>
	+<hub_ttgo_wattcycle/Bms/Ble/BlePacketAssembler.cpp>
	+<hub_ttgo_wattcycle/Telemetry/BinaryTelemetryCodec.cpp>
	+<hub_ttgo_wattcycle/Telemetry/InMemoryTelemetryStore.cpp>
	+<hub_ttgo_wattcycle/Auth/Sha256.cpp>
	+<hub_ttgo_wattcycle/Auth/PasswordHasher.cpp>
	+<hub_ttgo_wattcycle/Auth/CredentialPolicy.cpp>
	+<hub_ttgo_wattcycle/Auth/SessionStore.cpp>
	+<hub_ttgo_wattcycle/Web/JsonField.cpp>
	+<bridge_xt369p/Meter/Protocol/AtorchFrameParser.cpp>
	-<hub_ttgo_wattcycle/main.cpp>
	-<hub_ttgo_wattcycle/CompositionRoot/*>
	-<hub_ttgo_wattcycle/Wifi/*>
	-<hub_ttgo_wattcycle/Ota/*>
	-<hub_ttgo_wattcycle/Bms/Ble/WattcycleBleClient.cpp>
	-<hub_ttgo_wattcycle/Display/*>
	-<hub_ttgo_wattcycle/Esp/*>
	-<hub_ttgo_wattcycle/EspNow/*>
	-<hub_ttgo_wattcycle/Auth/AuthService.cpp>
	-<hub_ttgo_wattcycle/Auth/NvsCredentialStore.cpp>
	-<hub_ttgo_wattcycle/Web/EspWebGateway.cpp>
	-<hub_ttgo_wattcycle/Config/*>
	-<hub_ttgo_wattcycle/Telemetry/TelemetryPoller.cpp>
	-<bridge_xt369p/main.cpp>
	-<bridge_xt369p/CompositionRoot/*>
	-<bridge_xt369p/Display/*>
	-<bridge_xt369p/Esp/*>
	-<bridge_xt369p/EspNow/*>
	-<bridge_xt369p/Meter/Spp/*>
	-<bridge_xt369p/Meter/Protocol/AtorchCommands.cpp>
	-<bridge_xt369p/Telemetry/*>
	-<bridge_xt369p/Config/*>
test_build_src = yes
