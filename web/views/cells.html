<section class="view" data-view="cells" hidden>
  <header class="page-head">
    <p class="brand">WattCycle</p>
    <hr class="brand-rule" />
    <p class="page-title">Cells</p>
  </header>
  <div class="metrics">
    <article><span>Highest</span><strong id="cellMax">-- V</strong></article>
    <article><span>Lowest</span><strong id="cellMin">-- V</strong></article>
    <article><span>Delta</span><strong id="cellDelta">-- mV</strong></article>
    <article><span>Average</span><strong id="cellAvg">-- V</strong></article>
    <article><span>Balance current</span><strong id="balanceCurrent">-- A</strong></article>
  </div>
  <ul class="cell-legend" aria-label="Cell color legend">
    <li><span class="swatch swatch-max"></span> Highest</li>
    <li><span class="swatch swatch-min"></span> Lowest</li>
    <li><span class="swatch swatch-bal"></span> Balancing</li>
  </ul>
  <div id="cells" class="cells"></div>
</section>
