<section class="view" data-view="temperatures" hidden>
  <h2>Temperatures</h2>
  <div class="metrics">
    <article><span>MOS</span><strong id="mosTemp">-- °C</strong></article>
    <article><span>PCB</span><strong id="pcbTemp">-- °C</strong></article>
  </div>
  <figure class="chart-block">
    <figcaption>MOS / PCB history (up to 24h)</figcaption>
    <canvas id="chartTemps" width="860" height="160"></canvas>
  </figure>
  <h3>Cell sensors</h3>
  <div id="cellTemps" class="cells"></div>
</section>
