<section class="view" data-view="overview">
  <header class="hero">
    <p class="eyebrow">Live pack</p>
    <h1 id="soc">--%</h1>
    <p class="tagline" id="summary">Waiting for BLE telemetry…</p>
  </header>
  <div class="metrics">
    <article><span>Voltage</span><strong id="voltage">-- V</strong></article>
    <article><span>Current</span><strong id="current">-- A</strong></article>
    <article><span>Power</span><strong id="power">-- W</strong></article>
    <article><span>Capacity</span><strong id="capacity">-- / -- Ah</strong></article>
    <article><span>Cycles</span><strong id="cycles">--</strong></article>
    <article><span>SOH</span><strong id="soh">--%</strong></article>
  </div>
  <div class="charts-toolbar">
    <p class="hint">Hover a chart for the value at that instant. Current/power: <span class="ok">+ charge</span> / <span class="bad">− discharge</span>.</p>
    <button type="button" id="clearHistoryBtn" class="ghost-btn">Clear chart history</button>
  </div>
  <div class="charts">
    <figure>
      <figcaption>Voltage</figcaption>
      <canvas id="chartVoltage" width="860" height="120"></canvas>
    </figure>
    <figure>
      <figcaption>Current (+ charge / − discharge)</figcaption>
      <canvas id="chartCurrent" width="860" height="120"></canvas>
    </figure>
    <figure>
      <figcaption>Power (+ charge / − discharge)</figcaption>
      <canvas id="chartPower" width="860" height="120"></canvas>
    </figure>
    <figure>
      <figcaption>Capacity (guides at 10% / 90% of pack)</figcaption>
      <canvas id="chartCapacity" width="860" height="120"></canvas>
    </figure>
  </div>
</section>
