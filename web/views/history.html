<section class="view" data-view="history" hidden>
  <header class="page-head">
    <p class="brand">WattCycle</p>
    <hr class="brand-rule" />
    <p class="page-title">History</p>
  </header>
  <div class="subtabs" role="tablist" aria-label="History source">
    <button type="button" class="subtab active" data-history-tab="pack">Wattcycle pack</button>
    <button type="button" class="subtab" data-history-tab="solar">XT369P wattmeter</button>
  </div>

  <div class="history-panel" data-history-panel="pack">
    <div class="charts-toolbar">
      <p class="hint">Pack V / I / P / Ah — <span class="ok">+ charge</span> / <span class="bad">− discharge</span>.</p>
      <button type="button" id="clearPackHistoryBtn" class="ghost-btn">Clear pack history</button>
    </div>
    <div class="charts">
      <figure>
        <figcaption>Voltage</figcaption>
        <canvas id="chartVoltage" width="860" height="120"></canvas>
      </figure>
      <figure>
        <figcaption>Current</figcaption>
        <canvas id="chartCurrent" width="860" height="120"></canvas>
      </figure>
      <figure>
        <figcaption>Power</figcaption>
        <canvas id="chartPower" width="860" height="120"></canvas>
      </figure>
      <figure>
        <figcaption>Capacity</figcaption>
        <canvas id="chartCapacity" width="860" height="120"></canvas>
      </figure>
      <figure>
        <figcaption>MOS / PCB temps</figcaption>
        <canvas id="chartTemps" width="860" height="120"></canvas>
      </figure>
    </div>
  </div>

  <div class="history-panel" data-history-panel="solar" hidden>
    <div class="charts-toolbar">
      <p class="hint">XT369P solar V / I / P / Wh / Ah.</p>
      <button type="button" id="clearSolarHistoryBtn" class="ghost-btn">Clear solar history</button>
    </div>
    <div class="charts">
      <figure>
        <figcaption>Solar voltage</figcaption>
        <canvas id="chartHistSolarVoltage" width="860" height="120"></canvas>
      </figure>
      <figure>
        <figcaption>Solar current</figcaption>
        <canvas id="chartHistSolarCurrent" width="860" height="120"></canvas>
      </figure>
      <figure>
        <figcaption>Solar power</figcaption>
        <canvas id="chartHistSolarPower" width="860" height="120"></canvas>
      </figure>
      <figure>
        <figcaption>Solar energy</figcaption>
        <canvas id="chartHistSolarEnergy" width="860" height="120"></canvas>
      </figure>
      <figure>
        <figcaption>Solar capacity</figcaption>
        <canvas id="chartHistSolarCapacity" width="860" height="120"></canvas>
      </figure>
    </div>
  </div>
</section>
