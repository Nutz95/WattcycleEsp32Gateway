<section class="view" data-view="camera" hidden>
  <header class="page-head">
    <p class="brand">WattCycle</p>
    <hr class="brand-rule" />
    <p class="page-title">Camera</p>
  </header>
  <p class="hint">
    Sign in on this hub first. Opening this tab turns the panel dark and starts the front camera on port 47690.
    Leaving the tab, or closing the page, stops the picture and the microphone.
    The on-panel Camera page blocks this stream while it is open.
  </p>
  <img id="cameraView" class="camera-frame" alt="Front camera" />
  <div class="camera-meter" aria-hidden="true"><span id="cameraMeter"></span></div>
  <label class="hint">
    <input type="checkbox" id="cameraAudio" checked />
    Microphone
  </label>
  <p class="hint" id="cameraNote"></p>
</section>
