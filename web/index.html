<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Wattcycle Gateway</title>
  <link rel="stylesheet" href="/app.css" />
</head>
<body>
  <div id="authRoot" class="shell" hidden></div>
  <main id="appShell" class="shell" hidden>
    <nav class="tabs" aria-label="Telemetry views">
      <button type="button" class="tab active" data-tab="overview">Overview</button>
      <button type="button" class="tab" data-tab="dashboard">Dashboard</button>
      <button type="button" class="tab" data-tab="solar">Solar</button>
      <button type="button" class="tab" data-tab="ecoflow">EcoFlow</button>
      <button type="button" class="tab" data-tab="history">History</button>
      <button type="button" class="tab" data-tab="cells">Cells</button>
      <button type="button" class="tab" data-tab="temperatures">Temps</button>
      <button type="button" class="tab" data-tab="warnings">Alerts</button>
      <button type="button" class="tab" data-tab="gateway">Gateway</button>
      <button type="button" class="tab" data-tab="esp">ESP</button>
      <button type="button" class="tab" data-tab="account">Account</button>
    </nav>
    <div id="views">
      <!--VIEW:overview-->
      <!--VIEW:dashboard-->
      <!--VIEW:solar-->
      <!--VIEW:ecoflow-->

      <!--VIEW:cells-->
      <!--VIEW:temperatures-->

  <script src="/app.js"></script>

</html>
