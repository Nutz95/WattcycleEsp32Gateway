; Pocket / LilyGO T-Dongle-S3 ST7735 envs (included via platformio.ini extra_configs).
; Keep root platformio.ini under the 400-line project limit.

; Dongle ST7735 — switch HAL with BOARD_DONGLE_POCKET (default) or BOARD_DONGLE_LILYGO.
; Match vendor demos: no USE_FSPI_PORT; force REG_SPI_BASE via TftEsp32S3SpiFix.h
; so SPI_PORT=FSPI(1) hits GPSPI2 (IDF otherwise returns base 0 → blank/crash).
[dongle_pocket]
build_flags =
	-DBOARD_DONGLE_POCKET=1
	-DTFT_MOSI=11
	-DTFT_SCLK=10
	-DTFT_CS=12
	-DTFT_DC=13
	-DTFT_RST=14
	; No TFT_MISO / TFT_BL (vendor User_Setup leaves them undefined)

[dongle_lilygo]
build_flags =
	-DBOARD_DONGLE_LILYGO=1
	-DTFT_MOSI=3
	-DTFT_SCLK=5
	-DTFT_CS=4
	-DTFT_DC=2
	-DTFT_RST=1
	-DTFT_BL=38
	-DTFT_BACKLIGHT_ON=0

[tdongle_display]
build_flags =
	-DUSER_SETUP_LOADED=1
	-DST7735_DRIVER=1
	-DST7735_GREENTAB160x80=1
	-DTFT_RGB_ORDER=TFT_BGR
	-DTFT_INVERSION_ON=1
	-DTFT_WIDTH=80
	-DTFT_HEIGHT=160
	${dongle_pocket.build_flags}
	-DLOAD_GLCD=1
	-DLOAD_FONT2=1
	-DLOAD_FONT4=1
	-DLOAD_FONT6=1
	-DLOAD_FONT7=1
	-DLOAD_FONT8=1
	-DSPI_FREQUENCY=80000000
	-DTOUCH_CS=-1
	-include src/boards/dongle_s3/TftEsp32S3SpiFix.h

; Shared S3 USB / flash knobs for real T-Dongle hardware (16 MB, native USB).
; ST7735 register SPI is corrected by TftEsp32S3SpiFix.h, so the installed
; espressif32 platform is enough. Do not pin 6.5.0 (forces a ~230 MB core download).
; esptool 4.9: watchdog_reset after USB-Serial/JTAG upload.
; Prefetch everything with scripts/setup_pio.ps1.
[tdongle_board]
platform = espressif32
platform_packages =
	platformio/tool-esptoolpy@2.40900.250804
flash_size = 16MB
flash_mode = qio
before_reset = usb_reset
after_reset = watchdog_reset
; qio_opi enables Octal PSRAM on S3 (chip has 8MB; default board json says N8).
memory_type = qio_opi
build_flags =
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DBOARD_HAS_PSRAM=1

[env:bridge_wattcycle_tdongle]
platform = ${tdongle_board.platform}
platform_packages =
	${env.platform_packages}
	${tdongle_board.platform_packages}
board = esp32-s3-devkitc-1
framework = arduino
upload_port = COM7
monitor_port = COM7
board_build.partitions = min_spiffs.csv
board_upload.flash_size = ${tdongle_board.flash_size}
board_upload.before_reset = ${tdongle_board.before_reset}
board_upload.after_reset = ${tdongle_board.after_reset}
board_build.flash_size = ${tdongle_board.flash_size}
board_build.flash_mode = ${tdongle_board.flash_mode}
board_build.arduino.memory_type = ${tdongle_board.memory_type}
lib_deps =
	h2zero/NimBLE-Arduino@^2.3.0
	bodmer/TFT_eSPI@^2.5.43
build_flags =
	${tdongle_display.build_flags}
	${tdongle_board.build_flags}
	-DCORE_DEBUG_LEVEL=1
	-DBMS_POLL_INTERVAL_MS=2000
	-DWATTCYCLE_NIMBLE_V2=1
	-DCONFIG_BT_NIMBLE_MSYS1_BLOCK_COUNT=64
	-DCONFIG_BT_NIMBLE_ACL_BUF_COUNT=32
	-DCONFIG_BT_NIMBLE_ATT_PREFERRED_MTU=247
	-I src
	-I src/bridge_ttgo_wattcycle
	-I src/common
	'-DWIFI_SSID="${sysenv.WIFI_SSID}"'
	'-DBMS_BLE_ADDRESS="${sysenv.BMS_BLE_ADDRESS}"'
	'-DESPNOW_PEER_MAC="${sysenv.ESPNOW_PEER_MAC}"'
	'-DESPNOW_PMK="${sysenv.ESPNOW_PMK}"'
	'-DESPNOW_CHANNEL="${sysenv.ESPNOW_CHANNEL}"'
build_src_filter =
	+<common/>
	+<boards/common/>
	+<boards/dongle_s3/>
	+<boards/lilygo_t_dongle_s3/>
	+<bridge_ttgo_wattcycle/>
	-<bridge_ttgo_wattcycle/main.cpp>
	-<bridge_ttgo_wattcycle/Display/TtgoStatusDisplay.cpp>
	-<bridge_ttgo_wattcycle/Display/ButtonNavigator.cpp>
	-<boards/ttgo_tdisplay/>
	-<hub_common/>
	-<hub_ttgo_wattcycle/>
	-<bridge_xt369p/>
	-<bridge_ecoflow_delta3/>
	-<bridge_tdongle_tft_smoke/>
	-<hub_m5_wattcycle/>

[env:bridge_ecoflow_delta3]
platform = ${tdongle_board.platform}
platform_packages =
	${env.platform_packages}
	${tdongle_board.platform_packages}
board = esp32-s3-devkitc-1
framework = arduino
upload_port = COM8
monitor_port = COM8
board_build.partitions = min_spiffs.csv
board_upload.flash_size = ${tdongle_board.flash_size}
board_upload.before_reset = ${tdongle_board.before_reset}
board_upload.after_reset = ${tdongle_board.after_reset}
board_build.flash_size = ${tdongle_board.flash_size}
board_build.flash_mode = ${tdongle_board.flash_mode}
board_build.arduino.memory_type = ${tdongle_board.memory_type}
extra_scripts =
	pre:scripts/pio_embed_ecoflow_login_key.py
lib_deps =
	h2zero/NimBLE-Arduino@^2.3.0
	bodmer/TFT_eSPI@^2.5.43
build_flags =
	${tdongle_display.build_flags}
	${tdongle_board.build_flags}
	-DCORE_DEBUG_LEVEL=1
	; NimBLE mbuf pool — default 12 OOMs (rc=7) during GATT + conn-update race.
	-DCONFIG_BT_NIMBLE_MSYS1_BLOCK_COUNT=64
	-DCONFIG_BT_NIMBLE_ACL_BUF_COUNT=32
	-DCONFIG_BT_NIMBLE_ATT_PREFERRED_MTU=247
	-DCONFIG_BT_NIMBLE_HCI_EVT_BUF_COUNT=30
	-I src
	-I src/bridge_ecoflow_delta3
	-I src/common
	'-DWIFI_SSID="${sysenv.WIFI_SSID}"'
	'-DECOFLOW_BLE_ADDRESS="${sysenv.ECOFLOW_BLE_ADDRESS}"'
	'-DECOFLOW_SERIAL="${sysenv.ECOFLOW_SERIAL}"'
	'-DECOFLOW_USER_ID="${sysenv.ECOFLOW_USER_ID}"'
	'-DESPNOW_PEER_MAC="${sysenv.ESPNOW_PEER_MAC}"'
	'-DESPNOW_PMK="${sysenv.ESPNOW_PMK}"'
	'-DESPNOW_CHANNEL="${sysenv.ESPNOW_CHANNEL}"'
build_src_filter =
	+<boards/common/>
	+<boards/dongle_s3/>
	+<boards/lilygo_t_dongle_s3/>
	+<bridge_ecoflow_delta3/>
	-<bridge_ecoflow_delta3/main_headless.cpp>
	-<common/>
	-<hub_common/>
	-<hub_ttgo_wattcycle/>
	-<bridge_ttgo_wattcycle/>
	-<bridge_xt369p/>
	-<bridge_tdongle_tft_smoke/>
	-<hub_m5_wattcycle/>
	-<boards/ttgo_tdisplay/>

; TFT smoke — same Bodmer TFT_eSPI + USER_SETUP path as production (no host-local vendor tree).
[env:bridge_tdongle_tft_smoke]
platform = ${tdongle_board.platform}
platform_packages =
	${env.platform_packages}
	${tdongle_board.platform_packages}
board = esp32-s3-devkitc-1
framework = arduino
upload_port = COM7
monitor_port = COM7
board_build.partitions = min_spiffs.csv
board_upload.flash_size = ${tdongle_board.flash_size}
board_build.flash_size = ${tdongle_board.flash_size}
board_build.flash_mode = ${tdongle_board.flash_mode}
board_build.arduino.memory_type = ${tdongle_board.memory_type}
board_upload.before_reset = ${tdongle_board.before_reset}
board_upload.after_reset = ${tdongle_board.after_reset}
lib_deps =
	bodmer/TFT_eSPI@^2.5.43
build_flags =
	${tdongle_display.build_flags}
	${tdongle_board.build_flags}
	-DCORE_DEBUG_LEVEL=1
	-I src
build_src_filter =
	+<bridge_tdongle_tft_smoke/>
	+<boards/common/>
	+<boards/dongle_s3/>
	-<boards/dongle_s3/DonglePanelShell.cpp>
	-<boards/lilygo_t_dongle_s3/>
	-<boards/ttgo_tdisplay/>
	-<common/>
	-<hub_common/>
	-<hub_ttgo_wattcycle/>
	-<bridge_ttgo_wattcycle/>
	-<bridge_xt369p/>
	-<bridge_ecoflow_delta3/>
	-<hub_m5_wattcycle/>
